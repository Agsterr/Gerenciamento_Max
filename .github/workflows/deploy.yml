name: Deploy (Hetzner)

# push na main → testa → builda as imagens no GitHub (GHCR) → servidor faz pull e reinicia.
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-salao-max-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PUBLIC_URL: https://salaomax.focodev.com.br
  API_IMAGE: ghcr.io/agsterr/salao-max-api
  WEB_IMAGE: ghcr.io/agsterr/salao-max-web

jobs:
  test:
    name: Testes da API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salao_test
          POSTGRES_USER: salao
          POSTGRES_PASSWORD: salao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salao"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/salao_test
          DB_USER: salao
          DB_PASSWORD: salao
        run: mvn -B -q verify

  build:
    name: Build das imagens
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Site
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_URL }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy no servidor
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          if [ -z "$HETZNER_SSH_KEY" ] || [ -z "$HETZNER_HOST" ]; then
            echo "Defina HETZNER_SSH_KEY e HETZNER_HOST nos secrets do repositório."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar compose, nginx e script
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${USER}@${HOST}" 'mkdir -p /opt/salao-max'
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            deploy/docker-compose.prod.yml deploy/nginx.conf deploy/deploy.sh \
            "${USER}@${HOST}:/opt/salao-max/"

      - name: Pull e restart
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=40 "${USER}@${HOST}" \
            "set -euo pipefail
             docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null
             trap 'docker logout ghcr.io >/dev/null' EXIT
             API_IMAGE=${API_IMAGE}:${{ github.sha }} WEB_IMAGE=${WEB_IMAGE}:${{ github.sha }} \
               bash /opt/salao-max/deploy.sh"

      - name: Verificar URL pública
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${PUBLIC_URL}/actuator/health" | grep -q UP; then
              echo "No ar: ${PUBLIC_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::${PUBLIC_URL} não respondeu (confira o túnel Cloudflare/DNS)."
