name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salao_test
          POSTGRES_USER: salao
          POSTGRES_PASSWORD: salao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salao"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/salao_test
          DB_USER: salao
          DB_PASSWORD: salao
        run: mvn -B -q verify

  web:
    name: Site (tipos, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build

  mobile:
    name: Apps Flutter (analyze, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze e testes
        working-directory: mobile
        run: |
          set -euo pipefail
          for d in core cliente gestao; do
            echo "::group::$d"
            (cd "$d" && flutter pub get && flutter analyze && flutter test)
            echo "::endgroup::"
          done
