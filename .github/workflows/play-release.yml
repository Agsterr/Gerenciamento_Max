name: Play Store

# push na main mexendo em mobile/** → builda o .aab do canal "play" de cada app e envia para a faixa
# do teste fechado (Alpha, com os testadores) da Google Play. Faixa: input manual > variável do app
# (PLAY_TRACK_GESTAO / PLAY_TRACK_CLIENTE) > variável PLAY_TRACK > alpha. Para ir direto à produção, veja docs/PLAY_STORE.md.
# Pré-requisitos (uma vez, no Play Console): ver docs/PLAY_STORE.md.
on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/play-release.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Quais apps enviar"
        type: choice
        default: ambos
        options: [ambos, gestao, cliente]
      track:
        description: "Faixa da Play (auto = variável do app/PLAY_TRACK, senão alpha)"
        type: choice
        default: auto
        options: [auto, internal, alpha, beta, production]
      status:
        description: "auto = variável PLAY_RELEASE_STATUS (padrão draft). draft até a 1ª aprovação, depois completed"
        type: choice
        default: auto
        options: [auto, draft, completed]

concurrency:
  group: play-release-salao-max
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_URL: https://salaomax.focodev.com.br
  SITE_URL: https://salaomax.focodev.com.br
  # Push do app do cliente (Firebase). Sem os secrets, o app sai sem push (veja docs/PUSH.md).
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_APP_ID_GESTAO: ${{ secrets.FIREBASE_APP_ID_GESTAO }}
  FIREBASE_APP_ID_CLIENTE: ${{ secrets.FIREBASE_APP_ID_CLIENTE }}
  FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  release:
    name: AAB ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: gestao
            package: io.github.agsterr.salaomax.gestao
          - app: cliente
            package: io.github.agsterr.salaomax.cliente
    steps:
      - name: Filtrar app
        id: skip
        run: |
          SEL="${{ github.event.inputs.apps || 'ambos' }}"
          if [ "$SEL" != "ambos" ] && [ "$SEL" != "${{ matrix.app }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip != 'true'

      - name: Definir versão
        if: steps.skip.outputs.skip != 'true'
        id: version
        working-directory: mobile/${{ matrix.app }}
        run: |
          set -euo pipefail
          LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${LINE%%+*}"
          # A Play só aceita versionCode maior que o último enviado: o número da execução sempre cresce.
          CODE=$((1000 + ${{ github.run_number }}))
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "Versão ${NAME}+${CODE}"

      - uses: actions/setup-java@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: steps.skip.outputs.skip != 'true'
        with:
          channel: stable
          cache: true

      - name: Assinatura (chave de upload)
        if: steps.skip.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Configure os secrets ANDROID_KEYSTORE_* (veja docs/DEPLOY.md)."; exit 1
          fi
          DIR="mobile/${{ matrix.app }}/android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$DIR/app/upload-keystore.jks"
          cat > "$DIR/key.properties" <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Build AAB (canal play)
        if: steps.skip.outputs.skip != 'true'
        working-directory: mobile/${{ matrix.app }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build appbundle --release --flavor play \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --dart-define=DISTRIBUTION=play \
            --dart-define=API_URL=${API_URL} \
            --dart-define=SITE_URL=${SITE_URL} \
            --dart-define=FIREBASE_API_KEY=${FIREBASE_API_KEY} \
            --dart-define=FIREBASE_APP_ID=$([ "${{ matrix.app }}" = gestao ] && echo "${FIREBASE_APP_ID_GESTAO}" || echo "${FIREBASE_APP_ID_CLIENTE}") \
            --dart-define=FIREBASE_SENDER_ID=${FIREBASE_SENDER_ID} \
            --dart-define=FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}

      - name: Guardar AAB
        if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: salao-max-${{ matrix.app }}-play-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            mobile/${{ matrix.app }}/build/app/outputs/bundle/playRelease/app-play-release.aab
            mobile/${{ matrix.app }}/build/app/outputs/mapping/playRelease/mapping.txt
          retention-days: 30

      - name: Conta de serviço da Play configurada?
        if: steps.skip.outputs.skip != 'true'
        id: creds
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::Secret PLAY_SERVICE_ACCOUNT_JSON ausente: o .aab ficou só nos artifacts (veja docs/PLAY_STORE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Faixa e situação de CADA app: o cliente e o salão podem estar em fases diferentes (um já aprovado para produção, o outro não).
      # Ordem: escolha manual do disparo > variável do app > variável geral > padrão (alpha, rascunho).
      - name: Faixa e situação deste app
        if: steps.skip.outputs.skip != 'true'
        id: lane
        env:
          INPUT_TRACK: ${{ github.event.inputs.track }}
          INPUT_STATUS: ${{ github.event.inputs.status }}
          APP_TRACK: ${{ matrix.app == 'gestao' && vars.PLAY_TRACK_GESTAO || vars.PLAY_TRACK_CLIENTE }}
          APP_STATUS: ${{ matrix.app == 'gestao' && vars.PLAY_RELEASE_STATUS_GESTAO || vars.PLAY_RELEASE_STATUS_CLIENTE }}
          ALL_TRACK: ${{ vars.PLAY_TRACK }}
          ALL_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
        run: |
          set -euo pipefail
          [ "${INPUT_TRACK:-}" = "auto" ] && INPUT_TRACK=""
          TRACK="${INPUT_TRACK:-${APP_TRACK:-${ALL_TRACK:-alpha}}}"
          STATUS="draft"
          if [ -n "${INPUT_STATUS:-}" ] && [ "$INPUT_STATUS" != "auto" ]; then STATUS="$INPUT_STATUS"
          elif [ -n "${APP_STATUS:-}" ]; then STATUS="$APP_STATUS"
          elif [ -n "${ALL_STATUS:-}" ]; then STATUS="$ALL_STATUS"; fi
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.app }}: faixa $TRACK, situação $STATUS"

      - name: Enviar para a Play (${{ steps.lane.outputs.track }})
        if: steps.skip.outputs.skip != 'true' && steps.creds.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package }}
          releaseFiles: mobile/${{ matrix.app }}/build/app/outputs/bundle/playRelease/app-play-release.aab
          mappingFile: mobile/${{ matrix.app }}/build/app/outputs/mapping/playRelease/mapping.txt
          track: ${{ steps.lane.outputs.track }}
          status: ${{ steps.lane.outputs.status }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

      - name: Resumo
        if: steps.skip.outputs.skip != 'true'
        run: |
          if [ "${{ steps.creds.outputs.ok }}" = "true" ]; then
            echo "### ${{ matrix.app }} ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }} enviado para ${{ steps.lane.outputs.track }} (${{ steps.lane.outputs.status }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.app }} ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}: .aab nos artifacts (sem conta de serviço da Play)" >> "$GITHUB_STEP_SUMMARY"
          fi
