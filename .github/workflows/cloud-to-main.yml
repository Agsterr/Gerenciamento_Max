name: Agente na nuvem → main

# Sessões do Claude Code na nuvem trabalham num branch próprio (ccr-*) e não têm acesso ao servidor.
# Todo push nesses branches é mesclado direto na main e dispara o deploy, igual a um push na main.
# (Push feito com o GITHUB_TOKEN não dispara os outros workflows sozinho, por isso o "gh workflow run".)
on:
  push:
    branches:
      - "ccr-*"

concurrency:
  group: cloud-to-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  merge:
    name: Mesclar na main e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mesclar ${{ github.ref_name }} na main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-edit "origin/${GITHUB_REF_NAME}" -m "Merge do agente na nuvem (${GITHUB_REF_NAME})"; then
            echo "::error::Conflito ao mesclar ${GITHUB_REF_NAME} na main. Peça ao agente para atualizar o branch com a main (git pull origin main) e enviar de novo."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "Nada novo para a main."
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:main
          {
            echo "changed<<EOF"
            git diff --name-only "$BEFORE" HEAD
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Disparar deploy
        if: steps.merge.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.merge.outputs.changed }}
        run: |
          set -euo pipefail
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(backend|frontend|deploy)/|^\.github/workflows/deploy\.yml$'; then
            gh workflow run deploy.yml --ref main
            echo "### Deploy (servidor) disparado" >> "$GITHUB_STEP_SUMMARY"
          fi
          if echo "$CHANGED" | grep -qE '^mobile/|^\.github/workflows/mobile-release\.yml$'; then
            gh workflow run mobile-release.yml --ref main
            echo "### APK fora da loja disparado" >> "$GITHUB_STEP_SUMMARY"
          fi
          if echo "$CHANGED" | grep -qE '^mobile/|^\.github/workflows/play-release\.yml$'; then
            gh workflow run play-release.yml --ref main
            echo "### Google Play (teste fechado) disparado" >> "$GITHUB_STEP_SUMMARY"
          fi
