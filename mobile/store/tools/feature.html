<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Jakarta; font-weight: 800; src: url("../../core/fonts/PlusJakartaSans-ExtraBold.ttf"); }
  @font-face { font-family: Jakarta; font-weight: 600; src: url("../../core/fonts/PlusJakartaSans-SemiBold.ttf"); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; position: relative; font-family: Jakarta, sans-serif; color: #fff; }
  .cliente { background: linear-gradient(135deg, #FF6A9A 0%, #E5267A 50%, #8E2DE2 100%); }
  .gestao  { background: linear-gradient(135deg, #3A1A7A 0%, #22104D 55%, #140A2E 100%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(60px); }
  .cliente .g { background: rgba(255,255,255,.35); width: 420px; height: 300px; left: -120px; top: -120px; }
  .gestao  .g { background: rgba(229,38,122,.6); width: 460px; height: 320px; right: 60px; top: -160px; }
  .left { position: absolute; left: 60px; top: 50%; transform: translateY(-50%); width: 470px; }
  .icon { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  h1 { font-weight: 800; font-size: 46px; line-height: 1.05; margin-top: 24px; letter-spacing: -1px; }
  p { font-weight: 600; font-size: 21px; opacity: .88; margin-top: 12px; }
  .phone { position: absolute; width: 250px; aspect-ratio: 1320/2868; background: #0E0A18; border-radius: 36px; padding: 8px;
           box-shadow: 0 30px 60px rgba(10,0,30,.45); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 29px; display: block; }
  .p1 { right: 210px; top: 60px; transform: rotate(-7deg); }
  .p2 { right: 10px; top: 110px; transform: rotate(5deg); }
</style></head>
<body>
  <div class="glow g"></div>
  <div class="left"><img class="icon" id="icon"><h1 id="title"></h1><p id="subtitle"></p></div>
  <div class="phone p1"><img id="s1"></div>
  <div class="phone p2"><img id="s2"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get("theme");
  for (const k of ["icon", "s1", "s2"]) document.getElementById(k).src = q.get(k);
  document.getElementById("title").textContent = q.get("title");
  document.getElementById("subtitle").textContent = q.get("subtitle");
</script>
</body></html>
