name: salao_gestao
description: "Salão Max Gestão — agenda, clientes, estoque e financeiro do salão."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  salao_core:
    path: ../core
  intl: ^0.20.2
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  # Fotos do portfólio (galeria/câmera)
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # `flutter run` sem --flavor usa o canal da Play (veja mobile/README.md).
  default-flavor: play
  assets:
    - assets/icon.png

# Ícones (gerados de mobile/brand/*.svg): dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon_background.png
  adaptive_icon_foreground: assets/icon_foreground.png
  adaptive_icon_monochrome: assets/icon_monochrome.png

# Splash nativa: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#22104D"
  background_image: assets/icon_background.png
  image: assets/splash_logo.png
  android_12:
    color: "#22104D"
    image: assets/splash_android12.png
  fullscreen: false
  web: false
