name: salao_cliente
description: "Salão Max — agende seu horário no salão."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  salao_core:
    path: ../core
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # `flutter run` sem --flavor usa o canal da Play (veja mobile/README.md).
  default-flavor: play
  assets:
    - assets/icon.png

# Ícones (gerados de mobile/brand/*.svg): dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon_background.png
  adaptive_icon_foreground: assets/icon_foreground.png
  adaptive_icon_monochrome: assets/icon_monochrome.png

# Splash nativa: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#E5267A"
  background_image: assets/icon_background.png
  image: assets/splash_logo.png
  android_12:
    color: "#E5267A"
    image: assets/splash_android12.png
  fullscreen: false
  web: false
