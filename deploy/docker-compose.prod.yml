# Produção (Hetzner). As imagens são buildadas no GitHub Actions e publicadas no GHCR;
# o servidor só faz pull — buildar Java/Next lá estoura a RAM da VPS.
name: salao-max

services:
  db:
    image: postgres:16-alpine
    container_name: salao-max-db
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salao}
      POSTGRES_USER: ${POSTGRES_USER:-salao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salao}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # Backup diário do banco: ao subir e depois a cada 24 h, guarda os últimos BACKUP_KEEP_DAYS dias no
  # volume db_backups. Cópia FORA do servidor (recomendado): defina BACKUP_BUCKET com um bucket PRIVADO do R2
  # (nunca o de fotos, que é público). Como restaurar: docs/DEPLOY.md.
  backup:
    image: postgres:16-alpine
    container_name: salao-max-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-salao}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-salao}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: auto
    volumes:
      - db_backups:/backups
    command:
      - sh
      - -c
      - |
        set -u
        mkdir -p /backups
        if [ -n "$$BACKUP_BUCKET" ]; then
          apk add --no-cache aws-cli >/dev/null 2>&1 || echo "aws-cli indisponível: backup só neste servidor"
        fi
        dump() {
          f="/backups/salao-$$(date -u +%Y-%m-%d-%H%M).sql.gz"
          if pg_dump --no-owner --clean --if-exists | gzip > "$$f.tmp" && [ -s "$$f.tmp" ]; then
            mv "$$f.tmp" "$$f"
            echo "backup ok: $$f ($$(du -h "$$f" | cut -f1))"
            find /backups -name 'salao-*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
            if [ -n "$$BACKUP_BUCKET" ] && command -v aws >/dev/null 2>&1; then
              if aws s3 cp "$$f" "s3://$$BACKUP_BUCKET/db/$$(basename "$$f")" --endpoint-url "$$R2_ENDPOINT" >/dev/null; then
                echo "copia enviada para o bucket $$BACKUP_BUCKET"
              else
                echo "ERRO ao enviar a copia para o bucket $$BACKUP_BUCKET"
              fi
            fi
          else
            rm -f "$$f.tmp"
            echo "ERRO no pg_dump"
          fi
        }
        dump
        while true; do
          sleep 86400
          dump
        done
    mem_limit: 64m

  api:
    image: ${API_IMAGE:-ghcr.io/agsterr/salao-max-api:latest}
    container_name: salao-max-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-salao}
      DB_USER: ${POSTGRES_USER:-salao}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://salaomax.focodev.com.br}
      APP_TIMEZONE: America/Sao_Paulo
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://salaomax.focodev.com.br}
      APP_RELEASES_PATH: /app/releases
      APP_RELEASES_MAX_COUNT: ${APP_RELEASES_MAX_COUNT:-2}
      APP_RELEASE_DEPLOY_TOKEN: ${APP_RELEASE_DEPLOY_TOKEN:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # Fotos do portfólio: Cloudflare R2 (bucket salao-max-fotos); sem as variáveis, ficam no volume salon_media
      APP_MEDIA_PATH: /app/media
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      # E-mails (recuperar senha): Resend. Sem a chave o e-mail não sai (a API só registra no log).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: "${MAIL_FROM:-Salão Max <nao-responda@salaomax.focodev.com.br>}"
      # Assinatura pela Google Play: JSON da conta de serviço em base64 (veja docs/PLAY_STORE.md)
      PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${PLAY_SERVICE_ACCOUNT_JSON_BASE64:-}
      # Push do app do cliente: JSON da conta de serviço do Firebase em base64 (veja docs/PUSH.md)
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}
      # Pagamento pelo site (Stripe) e comissão dos representantes (veja docs/PAGAMENTOS.md)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      REFERRAL_COMMISSION_CENTS: ${REFERRAL_COMMISSION_CENTS:-1500}
      REFERRAL_HOLD_DAYS: ${REFERRAL_HOLD_DAYS:-7}
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k
    volumes:
      - apk_releases:/app/releases
      - salon_media:/app/media
    mem_limit: 448m

  web:
    image: ${WEB_IMAGE:-ghcr.io/agsterr/salao-max-web:latest}
    container_name: salao-max-web
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=128
      # nome do salão no ícone do app instalado (PWA): o site consulta a API pela rede interna
      API_INTERNAL_URL: http://api:8080
    mem_limit: 192m

  nginx:
    image: nginx:1.27-alpine
    container_name: salao-max-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-8089}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 64m

volumes:
  pgdata:
  db_backups:
  apk_releases:
  salon_media:
