services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salao
      POSTGRES_USER: salao
      POSTGRES_PASSWORD: salao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salao"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/salao
      DB_USER: salao
      DB_PASSWORD: salao
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-com-32-caracteres-ou-mais}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
