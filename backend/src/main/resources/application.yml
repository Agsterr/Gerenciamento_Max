spring:
  application:
    name: salao-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao}
    username: ${DB_USER:salao}
    password: ${DB_PASSWORD:salao}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: ${APP_TIMEZONE:America/Sao_Paulo}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    # Troque em produção (mínimo 32 caracteres)!
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-0123456789abcdef}
    ttl: 12h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
