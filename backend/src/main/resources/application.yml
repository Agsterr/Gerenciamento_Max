spring:
  application:
    name: salao-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao}
    username: ${DB_USER:salao}
    password: ${DB_PASSWORD:salao}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    # Sem hibernate.jdbc.time_zone: a JVM já roda no fuso do salão (TimeZoneEnvironmentPostProcessor)
    # e as datas são gravadas exatamente como a hora local.
  servlet:
    multipart:
      # APKs publicados pelo CI ou pelo painel da plataforma (vão para disco, não para a memória)
      max-file-size: 150MB
      max-request-size: 160MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    # Troque em produção (mínimo 32 caracteres)!
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-0123456789abcdef}
    # Token de 24h. Quem marca "Manter conectado" entra de novo sozinho quando ele vence.
    # Bloqueio e exclusão continuam valendo na hora (AccountStatusFilter).
    ttl: ${JWT_TTL:24h}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  # Administrador da plataforma (bloqueio de salões/usuários, APKs). Vazio = não cria.
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
  # APKs distribuídos fora da loja (atualização dentro do app)
  releases:
    storage-path: ${APP_RELEASES_PATH:/app/releases}
    max-retained: ${APP_RELEASES_MAX_COUNT:2}
    deploy-token: ${APP_RELEASE_DEPLOY_TOKEN:}
    public-base-url: ${APP_PUBLIC_URL:https://salaomax.focodev.com.br}
  # Assinatura pela Google Play (app de gestão): a API confere a compra com a Google.
  # PLAY_SERVICE_ACCOUNT_JSON_BASE64 = JSON da conta de serviço (a mesma do envio do app) em base64, com permissão
  # de ver dados financeiros e gerenciar pedidos/assinaturas no Play Console. Vazio = compra desligada.
  billing:
    play-package: ${PLAY_PACKAGE:io.github.agsterr.salaomax.gestao}
    service-account-json: ${PLAY_SERVICE_ACCOUNT_JSON_BASE64:}
    cron: ${BILLING_SYNC_CRON:0 0 5 * * *}
  # Pagamento pelo site (Asaas: Pix, boleto e cartão). ASAAS_API_KEY = chave de API; ASAAS_WEBHOOK_TOKEN = token que o
  # Asaas manda em cada aviso (você define); ASAAS_BASE_URL = https://api-sandbox.asaas.com/v3 para testar.
  # Vazios = assinatura pelo site desligada. Ver docs/PAGAMENTOS.md.
  asaas:
    api-key: ${ASAAS_API_KEY:}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
    base-url: ${ASAAS_BASE_URL:https://api.asaas.com/v3}
    price-cents: ${ASAAS_PRICE_CENTS:4990}
    site-url: ${APP_PUBLIC_URL:https://salaomax.focodev.com.br}
  # Loja do representante: mensalidade (Asaas) e dias de teste grátis.
  shop:
    price-cents: ${SHOP_PRICE_CENTS:4990}
    trial-days: ${SHOP_TRIAL_DAYS:7}
  # Captcha (Cloudflare Turnstile) nos cadastros de salão e de representante. Vazios = captcha desligado.
  turnstile:
    secret: ${TURNSTILE_SECRET:}
    site-key: ${TURNSTILE_SITE_KEY:}
  # Representantes: comissão fixa por mensalidade paga dos salões que indicaram (centavos) e dias de espera
  # (prazo de estorno) até ficar disponível para repasse.
  referral:
    commission-cents: ${REFERRAL_COMMISSION_CENTS:1500}
    hold-days: ${REFERRAL_HOLD_DAYS:7}
    # preço da mensalidade na Play (mais alto que o do site por causa da taxa da loja); só informativo nos relatórios
    play-price-cents: ${PLAY_PRICE_CENTS:5890}
    site-url: ${APP_PUBLIC_URL:https://salaomax.focodev.com.br}
    # salão que já usa o app há mais de N dias e aceita um vendedor: ele vende, mas sem a comissão da mensalidade
    late-link-days: ${REFERRAL_LATE_LINK_DAYS:30}
  # Sino de avisos: lidos há mais de keep-read-days dias e qualquer aviso com mais de keep-days dias são apagados à noite.
  notifications:
    keep-read-days: ${NOTIFICATIONS_KEEP_READ_DAYS:30}
    keep-days: ${NOTIFICATIONS_KEEP_DAYS:90}
  # Push (Firebase Cloud Messaging) para o app do cliente: JSON da conta de serviço do Firebase.
  push:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
    cron: ${PUSH_CRON:0 */5 * * * *}
  # E-mails (recuperar senha, avisos): Resend (https://resend.com). Sem a chave, o e-mail não é enviado.
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:Salão Max <nao-responda@salaomax.focodev.com.br>}
    site-url: ${APP_PUBLIC_URL:https://salaomax.focodev.com.br}
  # Fotos do portfólio: Cloudflare R2 (igual aos vídeos do foco-academia) ou, sem R2, disco local
  media:
    storage-path: ${APP_MEDIA_PATH:/app/media}
    max-upload-mb: ${APP_MEDIA_MAX_UPLOAD_MB:15}
    r2-bucket: ${R2_BUCKET:}
    r2-endpoint: ${R2_ENDPOINT:}
    r2-access-key-id: ${R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    r2-public-base-url: ${R2_PUBLIC_BASE_URL:}
  # Aviso diário ao salão dos clientes a lembrar (horário do salão)
  reminders:
    cron: ${APP_REMINDERS_CRON:0 0 8 * * *}
  # Lembretes de atendimento de cada profissional/usuário (sino do painel e do app)
  staff-reminders:
    cron: ${APP_STAFF_REMINDERS_CRON:0 */5 * * * *}
